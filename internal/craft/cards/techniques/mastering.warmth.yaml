id: mastering.warmth
craft: mastering
title: Warm the master with gentle saturation
intent: >-
  A little drive adds low harmonics that thicken the mix and round its peaks
  before the limiter sees them: the warm character of a master.
when: A master asked for a warm character, or one that sounds thin and clean beside its reference.
when_not:
  - A master asked to stay transparent.
  - A mix that is distorted already (a driven bass, a crushed drum bus).
applies_to: master
needs: [color.saturation]
set:
  color.saturation:
    drive: 3
    mix: 30
precision:
  color.saturation: {drive: 1, mix: 10}
place: before dynamics.limiter
verify:
  measure: crest_factor
  falls: 0.5
